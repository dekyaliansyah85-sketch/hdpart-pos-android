name: Build Android APK

on:
  push:
    branches: [ main, master ]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release HDPART POS APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Decode Release Keystore (optional)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/release.keystore
          echo "ANDROID_KEYSTORE_PATH=${{ github.workspace }}/android/release.keystore" >> $GITHUB_ENV
          echo "ANDROID_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
          echo "ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> $GITHUB_ENV
          echo "ANDROID_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> $GITHUB_ENV

      - name: Build Signed Release APK
        working-directory: android
        run: |
          gradle assembleRelease --no-daemon

      - name: Prepare Downloadable APK
        run: |
          mkdir -p dist-apk
          cp android/app/build/outputs/apk/release/app-release.apk "dist-apk/HDPART-POS.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HDPART-POS
          path: dist-apk/HDPART-POS.apk
          retention-days: 90

      - name: Publish GitHub Release with Direct APK Link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: HDPART POS v1.0.0 (Build #${{ github.run_number }})
          body: |
            Build otomatis APK **HDPART POS** (`com.hdpart.pos`).
            Unduh file `HDPART-POS.apk` di bawah ini dan instal langsung di perangkat Android.
          files: dist-apk/HDPART-POS.apk
          make_latest: true
